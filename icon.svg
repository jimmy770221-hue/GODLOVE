<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fe0"/><stop offset="1" stop-color="#1a4fa8"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.32" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#ffe866"/><stop offset="0.4" stop-color="#ffc61f"/>
      <stop offset="0.75" stop-color="#ff8f1c"/><stop offset="1" stop-color="#e0431b"/>
    </radialGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd83f"/><stop offset="1" stop-color="#f25a19"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="headclip"><path id="head" d="M70 330 C96 300 128 262 160 228 C196 192 250 176 304 186
        C362 198 404 240 404 296 C404 356 358 402 296 414 C250 422 214 412 186 396
        C160 384 120 368 92 356 C76 350 66 342 70 330 Z"/></clipPath>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bg)"/>
  <!-- 耳朵 -->
  <path d="M300 214 C338 156 398 118 460 108 C448 172 410 234 352 268 Z" fill="url(#ear)"/>
  <path d="M328 212 C362 172 404 148 432 140 C420 180 394 218 360 242 Z" fill="#b83a0c" opacity=".35"/>
  <path d="M176 232 C164 168 176 104 206 60 C244 104 270 162 272 214 Z" fill="url(#ear)"/>
  <path d="M196 214 C192 168 200 128 212 100 C234 136 248 174 250 210 Z" fill="#b83a0c" opacity=".3"/>
  <!-- 頭（含尖鼻） -->
  <use href="#head" fill="url(#fur)"/>
  <g clip-path="url(#headclip)">
    <!-- 下巴白毛 -->
    <path d="M60 340 C110 362 170 380 230 380 C260 380 280 372 296 360 C290 400 250 430 200 424 C140 416 90 384 60 340 Z" fill="#fff3d1"/>
    <!-- 光澤 -->
    <ellipse cx="230" cy="232" rx="110" ry="42" fill="url(#shine)"/>
  </g>
  <!-- 鼻頭 -->
  <ellipse cx="78" cy="334" rx="17" ry="13" fill="#4a210e"/>
  <ellipse cx="72" cy="329" rx="5.5" ry="3.5" fill="#fff" opacity=".75"/>
  <!-- 瞇眼 -->
  <path d="M176 280 C190 264 212 262 224 274" fill="none" stroke="#4a210e" stroke-width="11" stroke-linecap="round"/>
  <path d="M272 268 C286 254 308 254 318 266" fill="none" stroke="#4a210e" stroke-width="10" stroke-linecap="round"/>
  <!-- 嘴 -->
  <path d="M112 352 C128 362 146 362 158 354" fill="none" stroke="#7a3412" stroke-width="7" stroke-linecap="round"/>
  <!-- 腮紅 -->
  <ellipse cx="250" cy="316" rx="22" ry="12" fill="#ff5a2e" opacity=".4"/>
</svg>
